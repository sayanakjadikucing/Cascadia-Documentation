
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Character encoding -->
    <meta charset="utf-8">

    <!-- Responsive layout -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Website description -->
    <meta
        name="description"
        content="NUS Formula SAE Cascadia CM200DX documentation"
    >

    <!-- Website title (browser tab) -->
    <title>Cascadia Documentation | NUS Formula SAE</title>

    <!-- CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ========================================
         TOP NAVIGATION BAR
    ========================================= -->
    <header class="top">

        <!-- Mobile navigation button -->
        <button
            id="menu"
            class="mobile"
            aria-label="Toggle navigation"
        >
            ☰
        </button>

        <!-- Search bar -->
        <div class="search-wrap">

            <span>⌕</span>

            <input
                id="search"
                type="search"
                placeholder="Search documentation..."
                aria-label="Search documentation"
            >

            <kbd>Ctrl K</kbd>

            <!-- Search results appear here -->
            <div
                id="results"
                class="results"
                hidden
            ></div>

        </div>

        <!-- Light / dark mode toggle -->
        <button
            id="theme"
            class="icon-btn"
            title="Toggle theme"
            aria-label="Toggle theme"
        >
            ☀
        </button>

    </header>


    <!-- ========================================
         MAIN WEBSITE LAYOUT
    ========================================= -->
    <div class="layout">

        <!-- LEFT SIDEBAR -->
        <nav class="sidebar" id="sidebar">

            <div class="navtitle">
                Documentation
            </div>

            <!-- Sidebar navigation generated by script.js -->
            <div id="nav"></div>

            <!-- Sidebar footer -->
            <div class="sidefoot">
                R27e · HV Electrical Systems
                <br>
                <small>Internal reference template</small>
            </div>

        </nav>


        <!-- ====================================
             MAIN DOCUMENTATION CONTENT
        ===================================== -->
        <main id="content" tabindex="-1">

            <!-- Documentation pages are
                 generated by script.js -->

        </main>


        <!-- ====================================
             RIGHT TABLE OF CONTENTS
        ===================================== -->
        <aside class="toc">

            <h3>On This Page</h3>

            <p>Jump to any section</p>

            <!-- Page headings generated by script.js -->
            <div id="toc"></div>

        </aside>

    </div>


    <!-- ========================================
         JAVASCRIPT
    ========================================= -->
    <script src="script.js"></script>

</body>
</html>
